<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/logo_light.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (function () {
      try {
        var colorScheme = localStorage.getItem('color-scheme');
        if (colorScheme === 'light' || colorScheme === 'dark') {
          document.documentElement.setAttribute('data-user-theme', colorScheme);
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', colorScheme);
        }
      } catch (e) {}
    })();
  </script>
  <title>StarNovel</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
