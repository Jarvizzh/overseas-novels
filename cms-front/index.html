<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('color-scheme');
          if (!saved) {
            var legacy = localStorage.getItem('cms_theme');
            if (legacy === 'light' || legacy === 'dark') {
              saved = legacy;
              localStorage.setItem('color-scheme', legacy);
              localStorage.removeItem('cms_theme');
            }
          }
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (saved === 'light' || saved === 'dark') {
            if (meta) meta.content = saved;
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            if (meta) meta.content = 'light dark';
            var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/assets/logo_light.png?v=twin_exact" />
    <title>STAR NOVEL CMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
